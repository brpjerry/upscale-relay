[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upscale-cli"
version = "0.14.0"
description = "Video upscale relay - offline pipeline CLI (phase 1)"
requires-python = ">=3.12"
dependencies = [
    "av>=13",
    "numpy>=1.26",
    "aiohttp>=3.9",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "qasync>=0.27",
    "python-mpv>=1.0",
]
# Server tray GUI (Windows): Qt without the client's python-mpv dependency.
server-gui = [
    "PySide6>=6.6",
    "qasync>=0.27",
    "onnx==1.22.0",
]
# Optional source installation of the same exact stack that the small Windows
# release installs into its per-user runtime on first launch.
nvidia = [
    "onnx==1.22.0",
    "onnxruntime-gpu==1.28.0",
    "tensorrt-cu13-libs==10.16.1.11",
    "cuda-toolkit==13.3.1",
    "nvidia-cublas==13.6.0.2",
    "nvidia-cuda-nvrtc==13.3.33",
    "nvidia-cuda-runtime==13.3.29",
    "nvidia-cudnn-cu13==9.24.0.43",
    "nvidia-cufft==12.3.0.29",
    "nvidia-nvjitlink==13.3.33",
]

[project.scripts]
upscale-cli = "upscale_cli.cli:main"
relay-server = "relay_server.server:main"
relay-server-gui = "relay_server.tray:main"
relay-client = "relay_client_core.cli:main"
relay-desktop = "desktop_client.app:main"

[tool.setuptools.packages.find]
include = ["upscale_cli*", "relay_protocol*", "relay_media*", "relay_server*", "relay_client_core*", "desktop_client*"]
